# stepcode pnpm workspace
#
# 本仓库只保留桌面壳。dsh runtime 与九个 Cordis 插件留在 orchdesk，
# 不搬进来、不改写那边（见 docs/70-决策/0007-精简版归属.md）。
#
# 精简版桌面壳的代码在 apps/desktop。dsh 已不再装载，
# 因此这一层不需要 references/deepseek-harness 的 workspace globs。
packages:
  - 'apps/*'

# pnpm 11：构建脚本白名单（allowBuilds 取代 v10 的 onlyBuiltDependencies）。
# electron 的 postinstall 负责下载 Electron 二进制，必须放行。
allowBuilds:
  electron: true
  node-pty: true
  koffi: true
  esbuild: set this to true or false

# 关闭 peer 自动补装：避免为不存在的公网 peer 链报 404。
autoInstallPeers: false
